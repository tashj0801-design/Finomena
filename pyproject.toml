[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finomena"
version = "0.1.0"
description = "An educational character-level financial language model built from scratch."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "streamlit>=1.50",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
